[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "better-context-unity"
version = "1.1.0"
description = "Local Unity and C# codebase maps for coding agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Better Context Team" }
]
keywords = [
    "ai",
    "agents",
    "codebase",
    "context",
    "cli",
    "code-analysis",
    "dependency-graph",
    "pagerank"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

dependencies = []

[project.optional-dependencies]
full = [
    "tree-sitter>=0.22",
    "rich>=13.0",
    "typer>=0.9",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1",
]

[project.scripts]
better-context-unity = "better_context.cli:main"

[project.urls]
Upstream = "https://github.com/hoangnb24/better-agents-md"

[tool.hatch.build.targets.wheel]
packages = ["src/better_context"]

[tool.hatch.build.targets.sdist]
include = [
    "/pyproject.toml",
    "/src",
    "/README.md",
    "/LICENSE",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = ["tests/fixtures"]
addopts = "-v --tb=short"
